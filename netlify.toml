# Netlify continuous deployment for the Kafa'a portal (site: enec-kafaa).
# The app lives in kafaa/; paths below (publish) are relative to the base directory.
# `npm run build:deploy` = gen + i18n check + tsc + vite build, then scripts/make-deploy.mjs assembles
# deploy_out/ (_redirects, .well-known/kafaa-issuer.json, kafaa/ with index.html, ojt-sw.js, issuer JSON, assets).
# The netlify.toml that make-deploy writes INTO deploy_out/ (publish = ".", command = "") is only for
# prebuilt zip uploads; Netlify ignores it in a git-linked build because it sits inside the publish directory.
[build]
  base = "kafaa"
  command = "npm run build:deploy"
  publish = "deploy_out"

[build.environment]
  NODE_VERSION = "22"
  # tsc --noEmit type-checks the generated 22 MB src/seed/seed.json and needs about 2.3-2.5 GB of V8 heap; with the
  # default heap of the Netlify build image it dies with "JavaScript heap out of memory" (reproduced locally with
  # --max-old-space-size=2048 on both main and fsE-integration-qa). vite build peaks near 3 GB as well.
  NODE_OPTIONS = "--max-old-space-size=4096"
  # Set VITE_NEXUS_DEMO_PASSWORD in the Netlify UI (Site configuration > Environment variables), never here.
