# Netlify continuous deployment for the Kafa'a portal (site: enec-kafaa).
# The app lives in kafaa/; paths below (publish) are relative to the base directory.
# `npm run build:deploy` = gen + i18n check + tsc + vite build, then scripts/make-deploy.mjs assembles
# deploy_out/ (_redirects, .well-known/kafaa-issuer.json, kafaa/ with index.html, ojt-sw.js, issuer JSON, assets).
# The netlify.toml that make-deploy writes INTO deploy_out/ (publish = ".", command = "") is only for
# prebuilt zip uploads; Netlify ignores it in a git-linked build because it sits inside the publish directory.
[build]
  base = "kafaa"
  command = "npm run build:deploy"
  publish = "deploy_out"

[build.environment]
  NODE_VERSION = "22"
  # tsc --noEmit type-checks the generated 22 MB src/seed/seed.json and needs about 2.3-2.5 GB of V8 heap; with the
  # default heap of the Netlify build image it dies with "JavaScript heap out of memory" (reproduced locally with
  # --max-old-space-size=2048 on both main and fsE-integration-qa). vite build peaks near 3 GB as well.
  NODE_OPTIONS = "--max-old-space-size=4096"
  # Set VITE_NEXUS_DEMO_PASSWORD in the Netlify UI (Site configuration > Environment variables), never here.

# Security headers (audit 2026-10-13, finding 1). kafaa/scripts/make-deploy.mjs checks these blocks on every build (every header
# present, frame-ancestors 'none', the script-src hashes equal the sha256 of each inline <script> in the built index.html, the Supabase
# origin in connect-src) and copies them into deploy_out/netlify.toml, so a prebuilt zip upload carries the same headers.
# CSP notes: script-src allows the bundle ('self') and the two inline scripts of index.html by hash (language/theme before first paint,
# NEXUS rehearsal mode); style-src needs 'unsafe-inline' for the inline badge-hiding <style>, React style attributes and the srcdoc
# print frames (passport, SAT reports); fonts and small assets may be inlined by Vite as data: URIs; connect-src is Supabase REST,
# Auth, Edge Functions (kafaa-persona-signin) and Realtime of project hlirqxoddysxtdezwcgv; the OJT service worker is 'self'.
[[headers]]
  for = "/kafaa/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-qXTjCDTwKwU+p8XGjPv196HMXW0W4LKmWBLPPzACzE0=' 'sha256-mM0ONRkrN88pbby9g+b2y7WCKXRlzrXLwaa3fcVt62g='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://hlirqxoddysxtdezwcgv.supabase.co wss://hlirqxoddysxtdezwcgv.supabase.co; frame-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()"

# Content-hashed build output never changes under the same name: cache for a year. Missing chunks still 404 through _redirects
# (the 404 carries the same header, since Netlify matches headers on the request path: after a rollback, a browser that asked for a
# chunk name while it did not exist may keep that 404 until it clears its cache; chunk names are content hashes, so this needs a rollback).
# Netlify's deploy-preview drawer (/.netlify/scripts/cdp, previews only) frames app.netlify.com and asks for camera/microphone: the CSP
# and Permissions-Policy refuse that on previews; production has no drawer.
[[headers]]
  for = "/kafaa/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
